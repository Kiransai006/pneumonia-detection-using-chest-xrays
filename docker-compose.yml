services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      CORS_ORIGINS: http://localhost:3002
    ports:
      - "5001:5000"
    volumes:
      - ./web_application/pneumoniaEfficientNet.keras:/app/pneumoniaEfficientNet.keras:ro
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./web_application/frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5001
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
